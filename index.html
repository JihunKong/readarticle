 document.documentElement.lang=lang; document.body.setAttribute('data-lang',lang);
 document.title=U.title;
 document.getElementById('hd').innerHTML='<p class="kicker">'+E(U.kicker)+'</p>'+
   '<h1>'+E(U.title)+'</h1><p class="sub">'+E(U.sub)+'</p>';
 document.getElementById('lgl').textContent=U.pickLang;
 document.getElementById('ctl').textContent=U.pickCountry;

 var cb='<button class="btn cty'+(cty==='all'?' on':'')+'" data-c="all">'+E(U.allCountry)+'</button>';
 ['kz','kg','ru','vn','mn','lk'].forEach(function(c){
   cb+='<button class="btn cty'+(cty===c?' on':'')+'" data-c="'+c+'">'+E(CNAME[lang][c])+'</button>';});
 document.getElementById('ctys').innerHTML=cb;

 var h='';
 S.how.forEach(function(x,i){h+='<div class="hw"><div class="hwn">'+(i+1)+'</div><b>'+
   E(x[0])+'</b><p>'+E(x[1])+'</p></div>';});
 document.getElementById('how').innerHTML=h;

 var st='';
 S.steps.forEach(function(x,i){st+='<li><span class="stn">'+(i+1)+'</span><span>'+x+'</span></li>';});
 document.getElementById('steps').innerHTML=st;

 var out='';
 S.sets.forEach(function(s){
   var arts=SRC[s.id]||[];
   var mine=arts.filter(function(a){return a.c!=='kr'&&(cty==='all'||a.c===cty);});
   var kr=arts.filter(function(a){return a.c==='kr';});
   if(cty!=='all'&&mine.length===0) return;
   function card(a){
     return '<div class="a'+(a.c==='kr'?' kr':'')+'"><div class="am"><span>'+a.fl+'</span>'+
       '<span class="cn">'+E(CNAME[lang][a.c]||a.cn)+'</span><span class="o">'+E(a.o)+'</span>'+
       '<span>'+E(a.d)+'</span></div>'+
       '<a class="ah" href="'+E(a.u)+'" target="_blank" rel="noopener">'+E(a.h)+'</a></div>';
   }
   var fi='';s.find.forEach(function(x){fi+='<li>'+E(x)+'</li>';});
   var body='<h4 class="lb">📰 '+E(U.h_read)+' — '+E(U.myCountry)+'</h4>'+
     (mine.length?'<div class="arts">'+mine.map(card).join('')+'</div>'
                 :'<p class="none">—</p>')+
     '<h4 class="lb">📰 '+E(U.h_read)+' — '+E(U.korea)+'</h4>'+
     (kr.length?'<div class="arts">'+kr.map(card).join('')+'</div>'
               :'<p class="none">'+E(U.tip)+'</p>')+
     '<h4 class="lb">🔍 '+E(U.h_find)+'</h4><ul class="find">'+fi+'</ul>';
   out+='<section class="set'+(s.hot?' hot':'')+'"><div class="sh"><span class="se">'+
     s.emoji+'</span><div><h3>'+E(s.title)+'</h3><p class="ss">'+E(s.sub)+'</p></div></div>'+
     '<p class="intro">'+E(s.intro)+'</p>'+
     (s.note?'<p class="optnote">'+E(s.note)+'</p>':'')+body+'</section>';
 });
 document.getElementById('sets').innerHTML=out;

 var nh='<tr><th></th><th>'+E(U.myCountry)+'</th><th>'+E(U.korea)+'</th></tr>';
 S.note_rows.forEach(function(r){
   nh+='<tr><td>'+E(r)+'</td><td><input type="text"></td><td><input type="text"></td></tr>';});
 document.getElementById('notetab').innerHTML=nh;

 var fb='';
 S.files.forEach(function(f){fb+='<div class="fbx"><b>'+E(f[0])+'</b><p>'+E(f[1])+'</p></div>';});
 document.getElementById('files').innerHTML=fb;

 [['t_how',U.s_how],['t_steps',U.s_steps],['t_sets',U.s_sets],['t_note',U.s_note],
  ['t_files',U.s_files],['l_sets',U.l_sets],['l_note',U.l_note],['ft',U.footer],
  ['tipbox',U.tip]].forEach(function(a){
    document.getElementById(a[0]).textContent=a[1];});
 document.getElementById('bprint').textContent=U.print;
 document.getElementById('bclear').textContent=U.clear;
 bind();
}
function bind(){
 document.querySelectorAll('.btn.cty').forEach(function(b){
   b.onclick=function(){cty=b.getAttribute('data-c');render();};});
}
var lb='';
ORDER.forEach(function(l){lb+='<button class="btn lg" data-l="'+l+'">'+LABEL[l]+'</button>';});
document.getElementById('lgs').innerHTML=lb;
document.querySelectorAll('.btn.lg').forEach(function(b){
 b.onclick=function(){lang=b.getAttribute('data-l');
  document.querySelectorAll('.btn.lg').forEach(function(x){x.classList.toggle('on',x===b);});
  render();};});
document.querySelector('.btn.lg').classList.add('on');
document.getElementById('bprint').onclick=function(){window.print();};
document.getElementById('bclear').onclick=function(){
 document.querySelectorAll('table.note input').forEach(function(i){i.value='';});};
render();
</script>
</body></html>
